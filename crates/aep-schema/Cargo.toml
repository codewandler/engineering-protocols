[package]
name = "aep-schema"
description = "Wire representations and generated JSON Schema for the Agentic Engineering Protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true

# The planning store's frontmatter is published as a schema from here, the way every other document
# schema is: one generator, one drift check, one index. The dependency runs schema → backend rather
# than the reverse, because a backend that had to know about schema generation could not be swapped
# out — and the frontmatter is that backend's private format, deliberately absent from `aep-domain`.
aep-backend-markdown.workspace = true
ess-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
