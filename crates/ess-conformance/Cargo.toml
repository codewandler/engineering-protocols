[package]
name = "ess-conformance"
description = "What a conformance suite is — the canonical scenario IR — deciding whether a candidate command input satisfies a specification's guard, and synthesising the suite one specification obliges."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true

# The consistency pair a view query needs. Design §14 is explicit that
# `aep_contract::consistency::{ConsistencyToken, QueryConsistency}` already ship and that a second
# pair here would buy nothing but a translation table for the two to drift across — so the runner
# reuses them rather than restating them.
aep-contract.workspace = true
ess-compiler.workspace = true
ess-domain.workspace = true

# For `SuiteProvenance`, which derives every fact it shares with a projected artifact from
# `ess_gen::Provenance` rather than computing the digest, the system and the versions a second way.
# Two provenance types in one repository are two answers to "which specification produced this".
ess-gen.workspace = true

# The two the suite format needs, both already declared once in `[workspace.dependencies]`. A
# committed suite is JSON — the repository's canonical form, and the one a future runner in another
# language can read — so `serde_json` is a dependency of the definition, not only of a test.
#
# Still no third-party crate beyond the workspace list, and that stays a decision: `thiserror` would
# have bought two `Display` impls that are eleven lines each, and a value tree of this crate's own
# would have bought a second spelling of `aep_domain::node::Node`.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
