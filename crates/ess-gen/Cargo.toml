[package]
name = "ess-gen"
description = "Deterministic projections of an executable system specification: documentation, schemas, contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aep-domain.workspace = true
ess-compiler.workspace = true
ess-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"

[dev-dependencies]
# The tests validate published schemas against instances with a conforming validator rather than a
# hand-rolled one, which is what makes `pattern` checked. `default-features = false` drops
# `resolve-http`, `resolve-file` and the TLS backend: no test can retrieve a schema, which is
# affordable because every `$ref` this crate emits is a same-document pointer. Same version and same
# spelling as `aep-schema`, deliberately — one validator behaviour across the workspace.
jsonschema = { version = "0.49.9", default-features = false }

[lints]
workspace = true
