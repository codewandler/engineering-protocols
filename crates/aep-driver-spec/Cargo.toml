[package]
name = "aep-driver-spec"
description = "The driver's documents and records: a step map, the pin it names a workflow by, a run cursor and a harness-neutral tool config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

# The protocol's vocabulary, and the only dependency this crate has. It is a leaf on purpose:
# `aep-schema` has to see `RawStepMap` to publish its schema, `aep-engine` has to see `StepMap` to
# load `drivers/`, and both are things `aep-schema` already depends on — so a step-map type that
# could see the engine would close the cycle `aep-schema -> aep-driver -> aep-engine -> aep-schema`
# that review finding F1 found. The router, which does need `Evaluation`, is the other crate.
aep-domain.workspace = true

serde.workspace = true

# The step map is published as `schemas/generated/driver-steps.schema.json`, the way every other
# authored document in this repository is: one generator (`aep-schema`), one drift check, one index.
schemars.workspace = true

# The cursor is JSON on disk, and the map's digest is over canonical JSON — key-sorted, so a reader
# holding the document can recompute it without linking this crate.
serde_json.workspace = true

# The step map's digest: SHA-256, 64 hex characters. Same version and same spelling as `trace-domain`
# and `ess-gen`, deliberately — one hash implementation across the workspace.
sha2 = "0.10"

[lints]
workspace = true
