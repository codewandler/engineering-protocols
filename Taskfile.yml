# Task runner for engineering-protocols. Requires go-task (https://taskfile.dev).
version: "3"

tasks:
  default:
    desc: Run the full gate, as CI does.
    deps: [check]

  check:
    desc: >-
      Format check, lint, test, doc check, schema check, projection check, suite check and
      synthesis check — everything CI runs.
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test
      - task: doc-check
      - task: schema-check
      - task: generate-check
      - task: suite-check
      - task: synth-check

  # `cargo xtask fmt`, not `cargo fmt --all`: `--all` also formats every member's local path
  # dependencies, and `examples/billing-realization` depends by path on the synthesised crates
  # under `generated/rust/` — a tree whose bytes are the emitter's, held byte-identical by
  # `synth-check`. One owner per tree; rustfmt is not the generated workspaces' owner.
  fmt:
    desc: Format the source workspace's members.
    cmds:
      - cargo xtask fmt

  fmt-check:
    desc: Fail if any workspace member is unformatted. Generated workspaces are exempt by design.
    cmds:
      - cargo xtask fmt --check

  clippy:
    desc: Lint every target, warnings are errors.
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  test:
    desc: Run every test in the workspace.
    cmds:
      - cargo test --workspace

  generate:
    desc: Regenerate generated/ — the projections of examples/billing/.
    cmds:
      - cargo xtask generate

  generate-check:
    desc: Fail if the committed projections differ from what the specification produces.
    cmds:
      - cargo xtask generate --check

  # Beside `generate` rather than part of it: `generated/` has one owner and a recursive orphan scan,
  # so a second task writing into it would delete the first task's output. `xtask/src/main.rs` argues
  # it at length. The suites also cover two specifications where `generated/` covers one.
  suite:
    desc: Regenerate suites/generated/ — the conformance suites examples/ oblige.
    cmds:
      - cargo xtask suite

  suite-check:
    desc: Fail if the committed conformance suites differ from what the specifications oblige.
    cmds:
      - cargo xtask suite --check

  # Beside `generate` for the reason `suite` is: `generated/` has one owner per subtree, and the
  # synthesised workspaces under `generated/rust/` are the synth task's — the projection task's
  # orphan scan carves that root out, and `xtask`'s ownership test holds the carve-out to the list
  # of owners. This one also compiles: a workspace that matches its specification byte for byte and
  # no longer builds is a claim nothing else checks.
  synth:
    desc: Regenerate generated/rust/ — the workspaces the specifications determine.
    cmds:
      - cargo xtask synth

  synth-check:
    desc: >-
      Fail if the committed synthesised workspaces differ from what the specifications determine,
      no longer compile, or no longer hold the committed suite — the honest realization linkage
      must pass it and the corrupted one must fail it.
    cmds:
      - cargo xtask synth --check

  schema:
    desc: Regenerate schemas/generated/ from the Rust types.
    cmds:
      - cargo xtask schema

  schema-check:
    desc: Fail if the committed schemas differ from the Rust types.
    cmds:
      - cargo xtask schema --check

  doc:
    desc: Build the API documentation.
    cmds:
      - cargo doc --workspace --no-deps

  # Doc comments carry the design reasoning here, so a broken intra-doc link loses an argument, not
  # just a hyperlink. Same defect class as a clippy warning, so it is a step in `check` rather than a
  # job of its own, and it reuses the dependency build `test` has already paid for.
  doc-check:
    desc: Fail if rustdoc emits any warning.
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps
