# Deploys the public documentation site to GitHub Pages.
#
# The site is the *built output* of `website/` — never the repository's internal `docs/` tree.
# That distinction is load-bearing: `docs/` is the internal engineering record (unaccepted
# proposals and defect catalogues included), and the one-click "deploy from /docs" Pages option
# would publish it verbatim at the public URL. This workflow, with the repository's Pages source
# set to "GitHub Actions", is what keeps that option out of reach. The same warning lives in
# website/README.md and website/docusaurus.config.ts.
name: pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a superseded build stops rather than racing the newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
