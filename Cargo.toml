[workspace]
resolver = "2"
members = [
    "crates/aep-domain",
    "crates/aep-contract",
    "crates/aep-backend-markdown",
    "crates/aep-backend-memory",
    "crates/aep-engine",
    "crates/aep-schema",
    "crates/aep-conformance",
    "crates/adp-domain",
    "crates/aop-domain",
    "crates/ess-compiler",
    "crates/ess-conformance",
    "crates/ess-diff",
    "crates/ess-domain",
    "crates/ess-gen",
    "crates/ess-synth",
    "crates/infra-analyze",
    "crates/infra-compiler",
    "crates/infra-domain",
    "crates/infra-project",
    "crates/infra-spec",
    "crates/protocol-cli",
    "crates/trace-domain",
    "crates/trace-spec",
    "examples/billing-realization",
    "examples/gatepass-realization",
    "xtask",
]
# The synthesised workspaces under `generated/rust/` are outputs, not members: each carries its own
# `[workspace]` root so `cargo check` inside one never reaches this manifest, and excluding them here
# is what keeps that true if that inner header is ever lost — a generated crate silently joining the
# source workspace would put generated code under the source gate's lints and versions.
exclude = [
    "generated/rust/billing",
    "generated/rust/gatepass",
    # The browser realization and the host that links one into it, excluded for two different
    # reasons that land in the same place. The generated bridge is an output, like every tree under
    # `generated/`. `examples/billing-web` is hand-written and still cannot be a member: a
    # WebAssembly export is a `#[no_mangle]` item, which rustc's `unsafe_code` lint flags, and
    # `[workspace.lints.rust] unsafe_code = "forbid"` below is invariant 12 for the other fifteen
    # crates. `cargo xtask synth` builds both for `wasm32-unknown-unknown` and runs the boundary
    # smoke test, so neither is outside the gate.
    "generated/web/billing",
    "examples/billing-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/codewandler/engineering-protocols"
authors = ["Timo Friedl <1379383+timofriedlberlin@users.noreply.github.com>"]

[workspace.dependencies]
aep-domain = { path = "crates/aep-domain", version = "0.1.0" }
aep-contract = { path = "crates/aep-contract", version = "0.1.0" }
aep-backend-markdown = { path = "crates/aep-backend-markdown", version = "0.1.0" }
aep-backend-memory = { path = "crates/aep-backend-memory", version = "0.1.0" }
aep-engine = { path = "crates/aep-engine", version = "0.1.0" }
aep-conformance = { path = "crates/aep-conformance", version = "0.1.0" }
ess-compiler = { path = "crates/ess-compiler", version = "0.1.0" }
ess-conformance = { path = "crates/ess-conformance", version = "0.1.0" }
ess-diff = { path = "crates/ess-diff", version = "0.1.0" }
ess-domain = { path = "crates/ess-domain", version = "0.1.0" }
ess-gen = { path = "crates/ess-gen", version = "0.1.0" }
ess-synth = { path = "crates/ess-synth", version = "0.1.0" }
infra-analyze = { path = "crates/infra-analyze", version = "0.1.0" }
infra-compiler = { path = "crates/infra-compiler", version = "0.1.0" }
infra-domain = { path = "crates/infra-domain", version = "0.1.0" }
infra-project = { path = "crates/infra-project", version = "0.1.0" }
infra-spec = { path = "crates/infra-spec", version = "0.1.0" }
trace-domain = { path = "crates/trace-domain", version = "0.1.0" }
trace-spec = { path = "crates/trace-spec", version = "0.1.0" }
aep-schema = { path = "crates/aep-schema", version = "0.1.0" }
adp-domain = { path = "crates/adp-domain", version = "0.1.0" }
aop-domain = { path = "crates/aop-domain", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
