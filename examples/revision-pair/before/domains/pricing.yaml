domain: catalog.pricing

summary: Publishing price lists and retiring them.

naming:
  wire: pricing
  display: Pricing

types:
  - name: catalog.pricing.PriceListId
    kind: newtype
    of: Uuid

  # The enum the fixture's two type changes are about. `GBP` leaves in the `after` revision and
  # `CHF` arrives, which is one narrowing and one widening on one declaration.
  - name: catalog.pricing.Currency
    kind: enum
    variants: [EUR, USD, GBP]

  # A wrapper over a struct, not an alias for one. It is here because it is the only shape in this
  # repository's examples where a declared type wraps another declared type, which is what puts
  # `Currency` three hops away from the entity that ends up holding it.
  - name: catalog.pricing.Headline
    kind: newtype
    of: catalog.pricing.Money

  - name: catalog.pricing.Money
    kind: struct
    fields:
      - name: amount
        type: Decimal
      - name: currency
        type: catalog.pricing.Currency
    invariants:
      - amount >= 0

entities:
  - name: catalog.pricing.PriceList

    identity:
      name: price_list_id
      type: catalog.pricing.PriceListId

    fields:
      - name: headline
        type: catalog.pricing.Headline
      - name: floor
        type: catalog.pricing.Money

    # CHANGE 5 (with `after/`). The later revision states `floor.amount > 0` — a strictly stronger
    # condition, which the delta reports as *changed* and nothing more: which of two predicates is
    # stronger is a proof, not a comparison.
    invariants:
      - floor.amount >= 0

    lifecycle:
      initial: Draft
      states: [Draft, Published, Retired]
      terminal: [Retired]
      transitions:
        - name: publish
          from: [Draft]
          to: Published
        - name: retire
          from: [Published]
          to: Retired

errors:
  - name: catalog.pricing.InvalidPrice
    summary: The floor price is not one a price list may carry.
    fields:
      - name: submitted
        type: catalog.pricing.Money

  - name: catalog.pricing.PriceListStateConflict
    summary: The price list is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: catalog.pricing.PriceList.State

commands:
  # The command that brings a price list into existence. Nothing about it differs between the two
  # revisions — it is here so the specification obliges a conformance suite at all: every other
  # scenario needs an instance to act on, and without a `creates:` outcome the synthesiser refuses
  # each one for want of one.
  - name: catalog.pricing.CreatePriceList

    input:
      - name: headline
        type: catalog.pricing.Headline
      - name: floor
        type: catalog.pricing.Money

    outcomes:
      # CHANGE 6 (with `after/`). The later revision guards this branch with `floor.amount >= 1`,
      # a canonically different predicate — so the delta says the condition *changed*, and only
      # that. A guard rewritten with different spacing would resolve to the same predicate and
      # would not be a change at all.
      - name: created
        when: floor.amount > 0
        creates: catalog.pricing.PriceList
        instance: price_list_id
        emits:
          - catalog.pricing.PriceListCreated
        summary: The price list is created in Draft, at the headline price it was given.

      - name: rejected
        error: catalog.pricing.InvalidPrice
        summary: The floor price was not positive, and nothing was created.

  - name: catalog.pricing.PublishPriceList

    input:
      - name: price_list_id
        type: catalog.pricing.PriceListId

    outcomes:
      - name: published
        moves: catalog.pricing.PriceList.publish
        instance: price_list_id
        emits:
          - catalog.pricing.PriceListPublished
        summary: The price list leaves Draft and is now Published.

      - name: wrong-state
        wrong_state: true
        error: catalog.pricing.PriceListStateConflict
        summary: The price list is not in Draft, so it was not published.

  - name: catalog.pricing.RetirePriceList

    input:
      - name: price_list_id
        type: catalog.pricing.PriceListId

    outcomes:
      - name: retired
        moves: catalog.pricing.PriceList.retire
        instance: price_list_id
        emits:
          - catalog.pricing.PriceListRetired
        summary: The price list is withdrawn from sale.

      - name: wrong-state
        wrong_state: true
        error: catalog.pricing.PriceListStateConflict
        summary: The price list is not Published, so it was not retired.

events:
  - name: catalog.pricing.PriceListCreated
    fields:
      - name: price_list_id
        type: catalog.pricing.PriceListId

  - name: catalog.pricing.PriceListPublished
    fields:
      - name: price_list_id
        type: catalog.pricing.PriceListId

  - name: catalog.pricing.PriceListRetired
    fields:
      - name: price_list_id
        type: catalog.pricing.PriceListId

actors:
  # Who may do what. The fixture's two actor changes move one grant from the second actor to the
  # first, which is one widening and one narrowing.
  - name: catalog.pricing.PricingManager
    may:
      - catalog.pricing.CreatePriceList
      - catalog.pricing.PublishPriceList
    naming:
      display: Pricing manager

  - name: catalog.pricing.Auditor
    may:
      - catalog.pricing.RetirePriceList
    naming:
      display: Auditor
