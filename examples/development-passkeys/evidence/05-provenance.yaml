# The verification record `provenance-tracking` asks for: a statement, from something other than the
# agent, that the change is the one described. Without it `evidence.missing` never reaches zero and
# the work cannot leave adversarial verification — which is the principle doing its job.
- kind: verification
  claim: provenance
  verifier: policy-engine
  status: passed
  producer:
    producer: verifier
    verifier: policy-engine
  provenance:
    command: git log --format=%H -1
