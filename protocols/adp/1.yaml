# The development profile of AEP. Extension is additive: everything aep/1 declares remains available,
# because a principle written against the base protocol has to keep working here.
id: adp
version: 1
title: Agentic Development Protocol
summary: >-
  AEP for software development work: specification, decomposition, test-driven implementation,
  contract and property verification, and review.
extends: aep/1

phases:
  - decomposition
  - verification-setup
  - adversarial-verification

# What a development task may reason about beyond the base protocol.
evidence_kinds:
  # An implementation checked against the specification that generated its contracts and its tests.
  # Development-specific because a specification is a development artifact: operations work is
  # governed by what production is doing, not by what a compiler derived.
  - ess_conformance
  # A harness transcript checked against a trace specification: which tools the agent called, in
  # which order, with which arguments, in which environment and at what cost. Development-specific
  # for the same reason as the row above — the runs this governs are development runs, driven from
  # a plan the protocol owns — and it is deliberately not in the base protocol, because widening it
  # to every profile is additive later and narrowing it would not be.
  - trace_conformance

verifiers:
  - conformance-runner
  # Reads the transcript and decides it. Named separately from `conformance-runner` because the two
  # observe different things: one executes an implementation against a suite, the other reads a
  # recording of how an agent worked.
  - trace-checker

artifact_kinds:
  - executable-system-specification

# Development-specific fact families, on top of the base protocol's.
observables:
  - 'ess_conformance.**'
  # What a trace-conformance record projects: the verdict, the digest pair that says which run
  # against which document, and the three expectation counts.
  - 'trace_conformance.**'
  - 'mutation.**'
  - 'differential.**'
  - 'invariant.**'
  - 'clean_room.**'
  - 'build.**'
  - 'types.**'
